name: Publish to NPM

# push 到主分支时自动检查各包 version，仅发布 npm 上尚不存在的新版本
on:
  push:
    branches:
      - v5
      - main
      - master
    paths:
      - "packages/**"
      - ".github/workflows/publish.yml"
      - ".github/scripts/**"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publish artifacts
        run: |
          # Shared
          pnpm -C packages/blueprint-dsl build
          pnpm -C packages/i18n build
          pnpm -C packages/view-table build
          pnpm -C packages/view-scene3d build
          pnpm -C packages/webllm-assistant build
          # React 栈
          pnpm -C packages/ui run build:css
          pnpm -C packages/react-view run build:css
          pnpm -C packages/abuilder build
          # Vue 栈（typecheck 作为发布前校验）
          pnpm -C packages/vue-rx-store build
          pnpm -C packages/vue-blueprint build
          pnpm -C packages/vue-view build
          pnpm -C packages/abuilder-vue build

      - name: Publish packages (skip unchanged versions)
        run: |
          chmod +x .github/scripts/publish-if-new.sh
          publish_if_new() { .github/scripts/publish-if-new.sh "$1"; }

          # 框架无关
          publish_if_new @arronqzy/i18n
          publish_if_new @arronqzy/view-table
          publish_if_new @arronqzy/view-scene3d
          publish_if_new @arronqzy/webllm-assistant
          publish_if_new @arronqzy/blueprint-dsl
          publish_if_new @arronqzy/rx-store
          # React 绑定
          publish_if_new @arronqzy/react-rx-store
          publish_if_new @arronqzy/ui
          publish_if_new @arronqzy/react-blueprint
          publish_if_new @arronqzy/react-view
          publish_if_new @arronqzy/abuilder
          # Vue 绑定
          publish_if_new @arronqzy/vue-rx-store
          publish_if_new @arronqzy/vue-blueprint
          publish_if_new @arronqzy/vue-view
          publish_if_new @arronqzy/abuilder-vue
